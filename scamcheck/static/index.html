<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Free scam checker for India. Paste a suspicious SMS, WhatsApp message, link, UPI ID or number and get a clear answer in seconds.">
<meta name="referrer" content="no-referrer">
<title>ScamCheck: is this a scam?</title>
<style>

  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans", "Noto Sans Devanagari", sans-serif; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; }
  header b { font-size: 19px; }
  h1 { font-size: 26px; line-height: 1.25; margin: 8px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 14px; }
  textarea { width: 100%; min-height: 140px; resize: vertical; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font: inherit; }
  textarea:focus, button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button, .btn { font: inherit; min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); padding: 10px 16px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center;
    justify-content: center; gap: 8px; }
  button:disabled { opacity: .55; cursor: default; }
  .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; width: 100%; font-size: 18px; }

  .lang { min-height: 40px; padding: 6px 12px; font-size: 15px; }
  .thumb { display: flex; align-items: center; gap: 10px; margin: 6px 0 10px; font-size: 15px; color: var(--muted); }
  .thumb img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  .thumb button { min-height: 40px; margin-left: auto; }
  .hint { font-size: 15px; color: var(--muted); margin: 6px 0 0; }
  .msg { padding: 12px 14px; border-radius: 10px; background: var(--neutral-bg); margin-top: 12px; }
  .msg.err { background: var(--bad-bg); color: var(--bad); }
  .notice { background: var(--warn-bg); color: var(--ink); border-left: 5px solid var(--warn); padding: 12px 14px; border-radius: 10px;
    margin-top: 14px; white-space: pre-line; }
  #progress ul, .checks { list-style: none; padding: 0; margin: 8px 0 0; }
  #progress li, .checks li { padding: 6px 0; display: flex; gap: 10px; align-items: baseline; }
  .checks li { border-top: 1px solid var(--line); flex-wrap: wrap; }
  .checks .d { flex-basis: 100%; padding-left: 28px; color: var(--muted); font-size: 15px; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: s 1s linear infinite; flex: none; transform: translateY(2px); }
  @keyframes s { to { transform: translateY(2px) rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  .verdict { border-width: 2px; }
  .verdict h2 { font-size: 28px; margin: 0; line-height: 1.2; }
  .verdict .type { color: var(--muted); margin-top: 4px; }
  .verdict .type::first-letter { text-transform: uppercase; }
  .verdict.bad { border-color: var(--bad); background: var(--bad-bg); } .verdict.bad h2 { color: var(--bad); }
  .verdict.warn { border-color: var(--warn); background: var(--warn-bg); } .verdict.warn h2 { color: var(--warn); }
  .verdict.good { border-color: var(--ok); background: var(--ok-bg); } .verdict.good h2 { color: var(--ok); }
  .todo { font-size: 18px; margin: 12px 0 0; }
  .dest { margin: 10px 0 0; padding: 8px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); word-break: break-word; }
  h3 { font-size: 16px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; }
  .why { list-style: none; padding: 0; margin: 0; }
  .why li { padding: 8px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; margin-top: 7px; background: var(--muted); }
  .dot.critical, .dot.high { background: var(--bad); } .dot.medium { background: var(--warn); } .dot.reassuring { background: var(--ok); }
  .call { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 800; font-size: 22px; width: 100%; min-height: 60px; }
  @media (prefers-color-scheme: dark) { .call { color: #200; } }

  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; white-space: pre-wrap;
    word-break: break-word; font-size: 14px; max-height: 320px; overflow: auto; }
  ol { padding-left: 22px; } ol li { margin: 6px 0; }
  details { margin-top: 14px; } summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; color: var(--accent); font-weight: 600; }
  footer { color: var(--muted); font-size: 15px; margin-top: 28px; }
  footer a, .card a { color: var(--accent); }
  [hidden] { display: none !important; }

<div class="wrap">
  <header>
    <b>🛡️ ScamCheck</b>

  </header>

    <p data-t="privacy"></p>
    <p data-t-html="lost"></p>

</div>

// The verdict heading follows the language the person wrote in, which can differ from the page language.
const HEAD = {
  SCAM:         { English: "This is a scam", Hindi: "यह धोखा है", Hinglish: "Yeh scam hai" },
  LIKELY_SCAM:  { English: "Very likely a scam", Hindi: "लगभग पक्का धोखा", Hinglish: "Lagbhag pakka scam" },
  SUSPICIOUS:   { English: "Be careful", Hindi: "सावधान रहें", Hinglish: "Saavdhan rahiye" },
  INCONCLUSIVE: { English: "Couldn't tell for sure", Hindi: "पक्का नहीं कह सकते", Hinglish: "Pakka nahi keh sakte" },
  LIKELY_SAFE:  { English: "Probably safe", Hindi: "शायद सुरक्षित", Hinglish: "Shayad safe" },
  SAFE:         { English: "Looks safe", Hindi: "सुरक्षित लगता है", Hinglish: "Safe lagta hai" },
};
const STEP = {
  read_screenshot: ["Reading the screenshot", "स्क्रीनशॉट पढ़ रहे हैं"],
  extract_indicators: ["Finding links, numbers and UPI IDs", "लिंक, नंबर और UPI ID ढूँढ रहे हैं"],

  match_scam_scripts: ["Comparing with known scams", "जाने-पहचाने धोखों से मिला रहे हैं"],

  check_url_reputation: ["Checking security blocklists", "सुरक्षा ब्लॉकलिस्ट जाँच रहे हैं"],

  check_indicator_history: ["Checking earlier reports", "पुरानी रिपोर्ट देख रहे हैं"],
};
const BAD = ["SCAM", "LIKELY_SCAM"], MAX_UPLOAD = 5 * 1024 * 1024;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const newId = () => Math.random().toString(36).slice(2);
// visitor: who this browser is, for the fair share of free AI checks (kept across visits).
// convo: one conversation, so "I already paid" follows up on the check above it. A reload or "Check something else"
// starts a new one: a message pasted later is never mixed up with an old one.
const visitor = store.get("sid") || (() => { const v = newId(); store.set("sid", v); return v; })();
let convo = newId();
let lang = store.get("lang") || ((navigator.language || "").startsWith("hi") ? "hi" : "en");
let image = null, last = null, busy = false;
const t = k => T[lang][k];

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-t-html]").forEach(el => { el.innerHTML = t(el.dataset.tHtml); });
  document.querySelectorAll("[data-t-placeholder]").forEach(el => { el.placeholder = t(el.dataset.tPlaceholder); });
  $("#text").setAttribute("aria-label", t("title"));
  $("#lang").textContent = lang === "en" ? "हिंदी" : "English";
  $("#lang").lang = lang === "en" ? "hi" : "en";
  if (busy) $("#go").textContent = t("checking");
  if (last) renderResult(last.result, last.checks, last.shots);
}
$("#lang").onclick = () => { lang = lang === "en" ? "hi" : "en"; store.set("lang", lang); applyLang(); };

function formError(key) { const e = $("#formerr"); e.hidden = !key; e.textContent = key ? t(key) : ""; }

// Paste: the clipboard API needs HTTPS and isn't in every browser, so the button only shows where it can work.
if (navigator.clipboard && navigator.clipboard.readText) {
  $("#paste").hidden = false;
  $("#paste").onclick = async () => {
    try { const s = await navigator.clipboard.readText(); if (s) { $("#text").value = s; formError(null); } else $("#text").focus(); }
    catch { $("#text").focus(); const e = $("#formerr"); e.hidden = false; e.textContent = t("paste_fallback"); }
  };
}

// Screenshots: big phone photos are shrunk in the browser, so they upload fast on mobile data and fit the 5 MB limit.
async function shrink(file) {
  if (file.size <= MAX_UPLOAD * 0.8) return file;
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.88));
    return blob && blob.size < file.size ? new File([blob], "screenshot.jpg", { type: "image/jpeg" }) : file;
  } catch { return file; }
}
async function setImage(file) {
  formError(null);
  if (!file) { image = null; $("#thumb").hidden = true; $("#image").value = ""; return; }
  if (!file.type.startsWith("image/")) return formError("not_image");
  image = await shrink(file);
  if (image.size > MAX_UPLOAD) { image = null; return formError("err_big"); }
  const img = $("#thumb img"); URL.revokeObjectURL(img.src); img.src = URL.createObjectURL(image);
  $("#thumb").hidden = false;
}
$("#pick").onclick = () => $("#image").click();
$("#image").onchange = () => setImage($("#image").files[0]);
$("#unshot").onclick = () => setImage(null);
$("#text").addEventListener("paste", e => {  // a screenshot pasted on a computer
  const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith("image/"));
  if (f) { e.preventDefault(); setImage(f); }
});

async function readNdjson(resp, onEvent) {
  const reader = resp.body.getReader(), dec = new TextDecoder(); let buf = "";
  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i; while ((i = buf.indexOf("\n")) >= 0) { const line = buf.slice(0, i); buf = buf.slice(i + 1); if (line.trim()) onEvent(JSON.parse(line)); }
  }
}

// One line per check, in plain words. Developers get the raw results at /demo.
function detail(name, r) {
  if (!r || r.status === "error") return "Couldn't run this check this time.";
  switch (name) {
    case "read_screenshot": return r.status === "ok" ? "Read the text on this server. The image wasn't saved or sent anywhere." : "No readable text found.";
    case "extract_indicators": {
      const parts = [[r.urls, "link"], [r.phone_numbers, "phone number"], [r.upi_ids, "UPI ID"], [r.emails, "email address"]]
        .filter(([a]) => a && a.length).map(([a, w]) => `${a.length} ${w}${a.length > 1 ? "s" : ""}`);
      return parts.length ? "Found " + parts.join(", ") + "." : "No links, numbers or UPI IDs in the message.";
    }
    case "match_scam_scripts": return r.matches?.length ? "Matches: " + r.matches.map(m => m.script).join(", ") + "." : "Doesn't match a known scam script.";
    case "follow_redirects": return r.status === "ok" ? (r.hops.length > 1 ? `Goes to ${hostOf(r.final_url)}` +
      (r.hops.length > 2 ? ` after ${r.hops.length - 1} redirects.` : ".") : "It doesn't redirect anywhere.") :
      r.status === "dead" ? "The short link no longer works." : "Couldn't follow it.";
    case "check_domain": {
      if (r.is_official_domain) return `Official ${r.brand} website.`;
      const age = r.registration?.age_days;
      return (r.possible_impersonated_brand ? `Pretends to be ${r.possible_impersonated_brand}. ` : "") +
        (age != null ? `Website registered ${age} day${age === 1 ? "" : "s"} ago.` : "Couldn't find when the website was registered.");
    }
    case "check_url_reputation": {
      const sb = r.safe_browsing, vt = r.virustotal;
      const on = [sb?.status === "ok" && "Google Safe Browsing", vt && vt.status === "ok" && "VirusTotal"].filter(Boolean);
      if (!on.length) return "Blocklists not set up on this server.";
      return sb?.flagged ? "Google lists it as dangerous." : `Checked ${on.join(" and ")}.`;
    }
    case "visit_in_sandbox": return r.status === "ok" ? (r.asks_password || r.asks_otp || r.asks_card || r.asks_bank_login ?
      "The page asks for passwords, OTPs or card details." : "Opened it in an isolated browser.") : r.status === "dead" ? "The website no longer exists." : r.status === "busy" ? "Skipped: the safe browser was busy with other links. Everything else was checked." : "Couldn't open the link.";
    case "analyse_phone_number": return [r.country, r.history?.times_seen ? `checked by ${r.history.times_seen} other ${r.history.times_seen > 1 ? "people" : "person"} before` : ""].filter(Boolean).join(", ") + ".";
    case "check_indicator_history": return r.times_seen ? `Checked by ${r.times_seen} other ${r.times_seen > 1 ? "people" : "person"} before.` : "No one else has checked it before.";
  }
  return "";
}

const hostOf = u => { try { return new URL(u).hostname; } catch { return u; } };

function renderProgress(checks) {
  const box = $("#progress"); box.hidden = false;
  box.querySelector("ul").innerHTML = [...checks.values()].map(c =>
    `<li>${c.done ? "✅" : '<span class="spinner" aria-hidden="true"></span>'}<span>${esc(STEP[c.name]?.[lang === "hi" ? 1 : 0] || c.name)}</span></li>`).join("");
}

// The most serious reasons first; minor ones ("No HTTPS") shouldn't bury them.
const TOP_REASONS = 4;
const reasons = list => `<ul class="why">${list.map(e =>
  `<li><span class="dot ${esc(e.severity)}" aria-hidden="true"></span><span>${esc(e.finding)}</span></li>`).join("")}</ul>`;

function renderResult(res, checks, shots) {
  const box = $("#result");
  if (!res) { box.innerHTML = ""; return; }
  if (!res.verdict) { box.innerHTML = `<div class="card"><p style="margin:0">${esc(res.user_message)}</p></div>`; return; }
  const v = res.verdict, cls = BAD.includes(v) ? "bad" : v === "SUSPICIOUS" ? "warn" : ["SAFE", "LIKELY_SAFE"].includes(v) ? "good" : "";
  const order = { critical: 0, high: 1, medium: 2, low: 3, reassuring: 4 };
  const why = [...(res.evidence || [])].sort((a, b) => (order[a.severity] ?? 5) - (order[b.severity] ?? 5));
  const c = res.complaint;
  box.innerHTML = `
    ${res.already_paid ? `<div class="card verdict bad">
        <a class="btn call" href="tel:1930">${t("call")}</a><p class="call-sub">${t("call_sub")}</p></div>` : ""}
    <div class="card verdict ${cls}">
      <h2 tabindex="-1" id="vh">${esc(HEAD[v]?.[res.language] || HEAD[v]?.English || v)}</h2>
      ${res.scam_type ? `<div class="type">${esc(res.scam_label || res.scam_type)}</div>` : ""}
      ${(res.link_destinations || []).map(d => `<p class="dest">🔗 ${t("goes_to")} <b>${esc(d.goes_to)}</b>${d.official ? " " + t("official_site") : ""}</p>`).join("")}
      <h3>${t("what")}</h3>
      <p class="todo">${esc(res.user_message)}</p>
      ${why.length ? `<h3>${t("why")}</h3>${reasons(why.slice(0, TOP_REASONS))}` : ""}
      ${why.length > TOP_REASONS ? `<details><summary>${t("more")} (${why.length - TOP_REASONS})</summary>${reasons(why.slice(TOP_REASONS))}</details>` : ""}
      ${shots.length ? `<h3>${t("link_opens")}</h3>${shots.map(s => `<div class="shot"><img alt="Screenshot of the page the link opens" src="data:image/jpeg;base64,${s}"></div>`).join("")}` : ""}
      <details><summary>${t("how")}</summary><ul class="checks">${[...checks.values()].map(c =>
        `<li>✅ <span>${esc(STEP[c.name]?.[lang === "hi" ? 1 : 0] || c.name)}</span><span class="d">${esc(detail(c.name, c.result))}</span></li>`).join("")
        || `<li>${t("no_checks")}</li>`}</ul></details>
      ${res.limited ? `<p class="hint" id="limited">${t("limited_" + res.limited) || ""} ${t("limited_tail")}</p>` : ""}
    </div>
    ${c ? `<div class="card">
      <h3 style="margin-top:0">${t("steps")}</h3><ol>${c.urgent_steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
      <h3>${t("complaint")}</h3><pre id="complaint">${esc(c.complaint_text)}</pre>
      <div class="row"><button type="button" id="copy">${t("copy")}</button>
        <a class="btn" href="https://cybercrime.gov.in" target="_blank" rel="noopener">${t("file")}</a></div></div>` : ""}
    <div class="row">
      ${!res.already_paid && (BAD.includes(v) || v === "SUSPICIOUS") ? `<button type="button" id="paid">${t("paid")}</button>` : ""}
      <button type="button" id="again">${t("again")}</button>
    </div>`;
  $("#copy")?.addEventListener("click", async e => {
    try { await navigator.clipboard.writeText(c.complaint_text); }
    catch { getSelection().selectAllChildren($("#complaint")); document.execCommand("copy"); }
    e.target.textContent = t("copied");
  });
  $("#paid")?.addEventListener("click", () => {
    const ta = $("#text"); ta.value = t("paid_prefill"); $("#paid-hint").hidden = false;
    clearImage(); ta.scrollIntoView({ block: "center" }); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  });
  $("#again").addEventListener("click", startOver);
}

function clearImage() { image = null; $("#thumb").hidden = true; $("#image").value = ""; }

async function startOver() {
  const fd = new FormData(); fd.append("session_id", convo);
  fetch("/api/reset", { method: "POST", body: fd }).catch(() => {});  // frees the old one on the server
  convo = newId();
  last = null; $("#text").value = ""; clearImage(); $("#result").innerHTML = ""; $("#notice").hidden = true;
  $("#progress").hidden = true; $("#paid-hint").hidden = true; formError(null);
  window.scrollTo({ top: 0 }); $("#text").focus();
}

$("#f").onsubmit = async ev => {
  ev.preventDefault();
  if (busy) return;
  const text = $("#text").value.trim();
  if (!text && !image) return formError("err_empty");
  formError(null); busy = true;
  const go = $("#go"); go.disabled = true; go.textContent = t("checking");
  $("#result").innerHTML = ""; $("#notice").hidden = true; last = null;
  const checks = new Map(), shots = [];
  renderProgress(checks);
  const prog = $("#progress ul");
  // A free server sleeps when idle; say so instead of looking frozen.
  const waking = setTimeout(() => { prog.innerHTML = `<li><span class="spinner" aria-hidden="true"></span><span>${t("waking")}</span></li>`; }, 5000);
  const ctl = new AbortController(), timeout = setTimeout(() => ctl.abort(), 150000);
  const fd = new FormData(); fd.append("text", text); fd.append("session_id", convo); fd.append("visitor_id", visitor);
  if (image) fd.append("image", image, image.name || "screenshot.jpg");
  let result;
  try {
    const resp = await fetch("/api/investigate", { method: "POST", body: fd, signal: ctl.signal });
    clearTimeout(waking);
    if (!resp.ok) throw new Error(resp.status === 413 ? "err_big" : resp.status === 429 ? "err_busy" : "err_fail");
    await readNdjson(resp, e => {
      if (e.type === "tool_call" && STEP[e.name]) { checks.set(e.name + checks.size, { name: e.name }); renderProgress(checks); }
      else if (e.type === "tool_result") {
        const c = [...checks.values()].find(c => c.name === e.name && !c.done);
        if (c) { c.done = true; c.result = e.result; renderProgress(checks); }
      }
      else if (e.type === "screenshot") shots.push(e.data);
      else if (e.type === "notice") { const n = $("#notice"); n.hidden = false; n.textContent = e.message.replace(/\*/g, ""); }
      else if (e.type === "done") result = e.result;
    });
    if (!result) throw new Error("err_fail");
  } catch (err) {
    clearTimeout(waking);
    const key = T.en[err.message] ? err.message : "err_net";
    $("#result").innerHTML = `<div class="msg err" role="alert">${esc(t(key))}</div>`;
  } finally {
    clearTimeout(timeout); busy = false; go.disabled = false; go.textContent = t("check");
  }
  $("#progress").hidden = true;
  if (result) {
    last = { result, checks, shots };
    $("#text").value = ""; clearImage(); $("#paid-hint").hidden = true;
    renderResult(result, checks, shots);
    const h = $("#vh"); if (h) { h.scrollIntoView({ block: "start" }); h.focus({ preventScroll: true }); }
  }
};

applyLang();
</script>
